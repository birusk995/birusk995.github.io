<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Polo Yakala! | 3D Şeker Oyunu</title>
  <style>
    :root { --ink:#172035; --cream:#fffaf3; --pink:#ff5f8f; --gold:#ffc52e; --cyan:#44e0d0; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100dvh; overflow:hidden; color:var(--ink); font-family:ui-rounded, "Nunito", "Arial Rounded MT Bold", system-ui, sans-serif; background:#1c2547; }
    #game { width:100vw; height:100dvh; display:block; touch-action:none; }
    .hud { position:fixed; z-index:2; inset:0 0 auto; padding:max(15px, env(safe-area-inset-top)) 16px 0; pointer-events:none; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
    .brand { font-weight:1000; font-size:clamp(20px, 4vw, 31px); letter-spacing:-1px; line-height:.9; transform:rotate(-3deg); text-shadow:0 2px #fff; }
    .brand span { color:#ff477b; }
    .score-card { pointer-events:auto; min-width:158px; background:rgba(255,255,255,.92); border:3px solid #fff; border-radius:19px; padding:9px 12px; box-shadow:0 7px 0 rgba(28,37,71,.25); text-align:center; }
    .score-label { font-size:10px; font-weight:900; letter-spacing:1.3px; color:#69708b; }
    #score { font-size:25px; font-weight:1000; line-height:1; }
    .meter { height:7px; margin-top:7px; background:#e9e9f1; border-radius:9px; overflow:hidden; } .meter i { display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--cyan),#77e69e); border-radius:inherit; transition:width .18s; }
    .tip { position:fixed; z-index:2; bottom:max(18px, env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); max-width:calc(100% - 28px); padding:10px 15px; border-radius:999px; background:rgba(23,32,53,.78); color:#fff; font-size:13px; font-weight:800; text-align:center; pointer-events:none; backdrop-filter:blur(8px); }
    .legend { position:fixed; z-index:2; left:16px; bottom:max(18px, env(safe-area-inset-bottom)); display:flex; gap:7px; pointer-events:none; }
    .pill { padding:6px 9px; border-radius:99px; font-size:11px; font-weight:900; background:rgba(255,255,255,.85); box-shadow:0 3px 0 rgba(0,0,0,.1); } .pill b{ color:#e65b22; }
    .modal { position:fixed; inset:0; z-index:4; display:grid; place-items:center; padding:25px; background:rgba(22,31,60,.56); backdrop-filter:blur(9px); }
    .modal[hidden] { display:none; }
    .win { width:min(450px,100%); text-align:center; padding:34px 25px 29px; background:linear-gradient(150deg,#fffdf8,#fff0f3); border-radius:34px; border:4px solid white; box-shadow:0 18px 0 rgba(16,21,45,.2), 0 30px 70px rgba(0,0,0,.25); }
    .win .hearts { font-size:43px; letter-spacing:5px; animation:pulse 1.1s infinite alternate; } @keyframes pulse{to{transform:scale(1.12) rotate(3deg)}}
    .win h1 { margin:11px 0 8px; font-size:clamp(29px,8vw,44px); line-height:.9; color:#ee4674; }
    .win p { margin:0 0 22px; font-weight:700; color:#48516e; } button { cursor:pointer; border:0; color:#fff; background:linear-gradient(135deg,#ff628f,#f53e77); padding:13px 23px; border-radius:16px; font:900 16px inherit; box-shadow:0 5px 0 #bd2858; } button:active{transform:translateY(4px);box-shadow:0 1px 0 #bd2858}
    @media (max-width:600px) { .hud{padding-inline:12px}.legend{display:none}.tip{font-size:12px;bottom:14px}.score-card{min-width:137px}.brand{font-size:20px} }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Polo şeker yakalama oyunu"></canvas>
  <div class="hud"><div class="brand">POLO<br><span>YAKALA!</span></div><div class="score-card"><div class="score-label">PUAN</div><div id="score">0</div><div class="meter"><i id="progress"></i></div></div></div>
  <div class="legend"><span class="pill">⚪ Beyaz <b>+50</b></span><span class="pill">🟡 Altın <b>+350</b></span><span class="pill">🌈 Rengârenk <b>+1000</b></span></div>
  <div class="tip" id="tip">Sepeti hareket ettirmek için fareyi, parmağını veya ← → tuşlarını kullan.</div>
  <div class="modal" id="modal" hidden><div class="win"><div class="hearts">🤍 🟡 🌈</div><h1>Tebrikler, kazandın!</h1><p>50.000 puana ulaştın. Şeker yağmuru şimdi kutlamaya dönüştü!</p><button id="again">Yeniden Oyna</button></div></div>
  <script>
  (() => {
    const c=document.getElementById('game'), x=c.getContext('2d'), scoreEl=document.getElementById('score'), progress=document.getElementById('progress'), modal=document.getElementById('modal'), tip=document.getElementById('tip');
    let W,H,DPR, basketX, keys={}, candies=[], particles=[], score=0, won=false, last=0, spawn=0, raf;
    const types=[{n:'Beyaz',p:.65,v:50,col:'#fbfdff',edge:'#bdc8df'},{n:'Altın',p:.25,v:350,col:'#ffd52e',edge:'#d68b10'},{n:'Rengârenk',p:.1,v:1000,col:'rainbow',edge:'#9554d9'}];
    function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(DPR,0,0,DPR,0,0);basketX=Math.min(Math.max(basketX||W/2,54),W-54)} addEventListener('resize',resize); resize();
    function choose(){let r=Math.random();for(const t of types){r-=t.p;if(r<=0)return t}return types[0]}
    function addCandy(celebrate=false){let t=choose(); if(celebrate) t=types[Math.floor(Math.random()*3)];let speed=t.n==='Altın'?1.8:t.n==='Rengârenk'?2.5:1; candies.push({t,px:Math.random()*W,y:celebrate?H*.65:-35-Math.random()*150,vy:celebrate?-(2+Math.random()*5):(3.5+Math.random()*3.5)*speed,scale:celebrate?.65+Math.random()*.45:.75+Math.random()*.6,rot:Math.random()*6.28,spin:(Math.random()-.5)*.12,celebrate});}
    function roundedRect(cx,cy,w,h,r,fill){x.beginPath();x.roundRect(cx-w/2,cy-h/2,w,h,r);x.fillStyle=fill;x.fill()}
    function candy(q){const s=38*q.scale; x.save();x.translate(q.px,q.y);x.rotate(q.rot);x.shadowColor='rgba(12,20,48,.28)';x.shadowBlur=8*q.scale;x.shadowOffsetY=6*q.scale;
      let g=x.createRadialGradient(-s*.25,-s*.35,2,0,0,s); if(q.t.col==='rainbow'){g.addColorStop(0,'#fff');g.addColorStop(.18,'#ff5e87');g.addColorStop(.43,'#ffd943');g.addColorStop(.62,'#54e8c9');g.addColorStop(.82,'#7d75ff');g.addColorStop(1,'#f25fc1')}else{g.addColorStop(0,'#fff');g.addColorStop(.27,q.t.col);g.addColorStop(1,q.t.edge)} x.beginPath();x.arc(0,0,s,0,Math.PI*2);x.fillStyle=g;x.fill();x.shadowColor='transparent'; x.beginPath();x.arc(0,0,s*.56,0,Math.PI*2);x.lineWidth=2*q.scale;x.strokeStyle=q.t.col==='rainbow'?'rgba(255,255,255,.76)':'rgba(75,91,121,.45)';x.stroke();x.fillStyle=q.t.col==='rainbow'?'#fff':'#64718c';x.font=`900 ${s*.38}px Arial`;x.textAlign='center';x.textBaseline='middle';x.fillText('POLO',0,1);x.restore();}
    function drawWorld(){let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#66d8ff');sky.addColorStop(.65,'#d1f1ff');sky.addColorStop(.651,'#ffd59b');sky.addColorStop(1,'#f59475');x.fillStyle=sky;x.fillRect(0,0,W,H);x.fillStyle='rgba(255,255,255,.55)';for(let i=0;i<5;i++){let px=(i*.27+.1)*W,py=H*(.16+(i%2)*.08);x.beginPath();x.arc(px,py,30,0,6.28);x.arc(px+35,py+4,24,0,6.28);x.arc(px-28,py+8,19,0,6.28);x.fill()}x.fillStyle='rgba(34,87,119,.16)';x.beginPath();x.moveTo(0,H*.69);x.lineTo(W*.34,H*.57);x.lineTo(W*.57,H*.7);x.lineTo(W,H*.53);x.lineTo(W,H*.72);x.lineTo(0,H*.78);x.fill();x.fillStyle='#84ce98';x.beginPath();x.moveTo(0,H*.74);x.lineTo(W,H*.7);x.lineTo(W,H);x.lineTo(0,H);x.fill();}
    function basket(){let y=H-86,w=Math.max(100,Math.min(145,W*.27)),h=55;x.save();x.translate(basketX,y);x.shadowColor='rgba(11,37,47,.25)';x.shadowBlur=12;x.shadowOffsetY=9;roundedRect(0,7,w,h,12,'#b55d24');x.shadowColor='transparent';roundedRect(0,1,w-10,h-14,9,'#f5a64b');x.fillStyle='#7e3b1f';for(let i=-w/2+14;i<w/2;i+=18)x.fillRect(i,-19,5,h-5);x.strokeStyle='#69311d';x.lineWidth=5;x.beginPath();x.arc(0,-h*.42,w*.3,Math.PI,0);x.stroke();x.restore();return {y,w,h}}
    function burst(px,py,kind){for(let i=0;i<28;i++)particles.push({px,py,vx:(Math.random()-.5)*10,vy:(Math.random()-.6)*10,life:1,col:kind==='rainbow'?`hsl(${Math.random()*360} 90% 60%)`:kind==='gold'?'#ffd12c':'#fff',sz:3+Math.random()*7})}
    function update(dt){if(!won){let speed=9*dt;if(keys.ArrowLeft||keys.a)basketX-=speed;if(keys.ArrowRight||keys.d)basketX+=speed;basketX=Math.max(58,Math.min(W-58,basketX));spawn+=dt;if(spawn>Math.max(.22,.8-score/250000)){addCandy();spawn=0}}let b=basket();for(let i=candies.length-1;i>=0;i--){let q=candies[i];q.y+=q.vy*dt*3.9;q.rot+=q.spin*dt*3.7;if(!q.celebrate&&!won&&q.y>b.y-36&&q.y<b.y+34&&Math.abs(q.px-basketX)<b.w*.48){score+=q.t.v;scoreEl.textContent=score.toLocaleString('tr-TR');progress.style.width=Math.min(score/50000*100,100)+'%';burst(q.px,q.y,q.t.col==='rainbow'?'rainbow':q.t.col==='#ffd52e'?'gold':'white');candies.splice(i,1);if(score>=50000)win();continue}if(q.y>H+90||q.y<-100)candies.splice(i,1)}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.px+=p.vx*dt*3;p.py+=p.vy*dt*3;p.vy+=.28*dt*3;p.life-=.025*dt*3;if(p.life<=0)particles.splice(i,1)}}
    function render(){drawWorld();candies.forEach(candy);particles.forEach(p=>{x.globalAlpha=Math.max(0,p.life);x.fillStyle=p.col;x.fillRect(p.px,p.py,p.sz,p.sz);x.globalAlpha=1});basket()}
    function loop(t){let dt=Math.min(2,(t-last)/16.67||1);last=t;update(dt);render();raf=requestAnimationFrame(loop)}
    function win(){won=true;tip.textContent='Kutlama zamanı!';for(let i=0;i<55;i++)setTimeout(()=>addCandy(true),i*35);setTimeout(()=>modal.hidden=false,850)}
    function reset(){score=0;won=false;candies=[];particles=[];for(let i=0;i<4;i++)setTimeout(()=>addCandy(),i*180);scoreEl.textContent='0';progress.style.width='0%';modal.hidden=true;tip.textContent='Sepeti hareket ettirmek için fareyi, parmağını veya ← → tuşlarını kullan.'}
    addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);function pointer(e){basketX=e.clientX}c.addEventListener('pointermove',pointer);c.addEventListener('pointerdown',pointer);document.getElementById('again').onclick=reset;reset();raf=requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
